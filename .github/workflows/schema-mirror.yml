name: schema-mirror

on:
  push:
    branches: [master]
    # Audit I7 (2026-06-10): also fire the full drift/pin/secret gate
    # suite on release tags — build.yml alone fires on a tag (clippy +
    # build + publish), so a re-tag / hotfix-branch tag / force-push
    # could otherwise publish a release from a commit whose gates never
    # ran. Mirrors the toolkit's tag-gated install-pin-check/changelog-check.
    tags: ['mnemonic-gui-v*']
  pull_request:
    branches: [master, "release/**"]

jobs:
  schema-mirror:
    name: schema-mirror gate
    runs-on: ubuntu-latest
    steps:
      - name: checkout-mnemonic-gui
        uses: actions/checkout@v5

      - name: install-rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo-cache
        uses: Swatinem/rust-cache@v2

      - name: parse-pinned-upstream
        # v0.5.1 cycle: parse `pinned-upstream.toml` once via Python 3.11+
        # stdlib `tomllib`, export per-CLI tag values as step outputs that
        # the install-* steps below consume via the env-var pattern
        # (passing GHA expressions to `env:` rather than interpolating
        # them into `run:` scripts — GitHub's recommended hardening for
        # any expression substitution, even when the source is trusted).
        # Closes FOLLOWUP `schema-mirror-yml-toolkit-pin-tracks-pinned-upstream`
        # (v2 cleanup half). Single source of truth: `pinned-upstream.toml`.
        # ubuntu-latest ships python3.12; no pip install required.
        id: pins
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pinned-upstream.toml", "rb") as f:
              d = tomllib.load(f)
          for cli in ("mnemonic", "md", "ms", "mk"):
              print(f"{cli}_tag={d[cli]['tag']}")
          PY

      - name: install-mnemonic-toolkit
        # Tag sourced from `pinned-upstream.toml [mnemonic].tag` via the
        # parse-pinned-upstream step above (v0.5.1+). The previous v0.5.0
        # cycle bumped the hardcoded literal v0.14.0 → v0.16.0 at `54865a7`;
        # the v0.5.1 cycle parameterizes that literal so future toolkit
        # bumps auto-track without a separate workflow edit. Same dynamic
        # tag pattern applied to md/ms/mk install steps below.
        env:
          TAG: ${{ steps.pins.outputs.mnemonic_tag }}
        run: |
          cargo install --locked \
            --git https://github.com/bg002h/mnemonic-toolkit \
            --tag "$TAG" \
            mnemonic-toolkit

      - name: install-md-cli
        env:
          TAG: ${{ steps.pins.outputs.md_tag }}
        run: |
          cargo install --locked \
            --git https://github.com/bg002h/descriptor-mnemonic \
            --tag "$TAG" \
            md-cli

      - name: install-ms-cli
        env:
          TAG: ${{ steps.pins.outputs.ms_tag }}
        run: |
          cargo install --locked \
            --git https://github.com/bg002h/mnemonic-secret \
            --tag "$TAG" \
            ms-cli

      - name: install-mk-cli
        env:
          TAG: ${{ steps.pins.outputs.mk_tag }}
        run: |
          cargo install --locked \
            --git https://github.com/bg002h/mnemonic-key \
            --tag "$TAG" \
            mk-cli

      # v0.4.0: `clone-upstream-mnemonic-toolkit` step retired. The
      # GUI no longer scrapes upstream source via syn (build.rs was
      # deleted in v0.4.0; secret-class taxonomy is now imported from
      # `mnemonic_toolkit::secret_taxonomy` per the v0.14.0 toolkit
      # release). The `MNEMONIC_GUI_UPSTREAM_ROOT` env var has no
      # remaining consumer in the test tree (`tests/fixtures/` is
      # vendored; `tests/schema_mirror.rs::source_audit` was deleted).

      - name: smoke-gui-schema-mnemonic
        run: mnemonic gui-schema | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['version']>=1 and d['cli']=='mnemonic', d"

      - name: smoke-gui-schema-md
        run: md gui-schema | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['version']>=1 and d['cli']=='md', d"

      - name: smoke-gui-schema-ms
        run: ms gui-schema | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['version']>=1 and d['cli']=='ms', d"

      - name: smoke-gui-schema-mk
        run: mk gui-schema | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['version']>=1 and d['cli']=='mk', d"

      - name: cargo-test-schema-mirror
        env:
          MNEMONIC_BIN: mnemonic
          MD_BIN: md
          MS_BIN: ms
          MK_BIN: mk
        run: cargo test --test schema_mirror

      # v0.4.0: cargo-test-secrets-canonical-fallback step retired —
      # the GUI no longer scrapes upstream secret-class taxonomy via
      # build.rs. SECRET_* is now imported from mnemonic-toolkit's
      # pub mod secret_taxonomy (v0.14.0+); the toolkit owns the
      # parity-test enforcement at its own build time. The GUI-side
      # backstop lives in tests/secret_taxonomy_pin.rs (runs as part
      # of cargo-test-full-suite below; no env-var needed).

      - name: cargo-test-full-suite
        env:
          MNEMONIC_BIN: mnemonic
          MD_BIN: md
          MS_BIN: ms
          MK_BIN: mk
        run: cargo test --workspace
