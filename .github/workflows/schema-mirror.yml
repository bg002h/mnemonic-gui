name: schema-mirror

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  schema-mirror:
    name: schema-mirror gate
    runs-on: ubuntu-latest
    steps:
      - name: checkout-mnemonic-gui
        uses: actions/checkout@v4

      - name: install-rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo-cache
        uses: Swatinem/rust-cache@v2

      - name: install-mnemonic-toolkit
        run: |
          cargo install --locked \
            --git https://github.com/bg002h/mnemonic-toolkit \
            --tag mnemonic-toolkit-v0.13.0 \
            mnemonic-toolkit

      - name: install-md-cli
        run: |
          cargo install --locked \
            --git https://github.com/bg002h/descriptor-mnemonic \
            --tag descriptor-mnemonic-md-cli-v0.5.0 \
            md-cli

      - name: install-ms-cli
        run: |
          cargo install --locked \
            --git https://github.com/bg002h/mnemonic-secret \
            --tag ms-cli-v0.2.1 \
            ms-cli

      - name: install-mk-cli
        run: |
          cargo install --locked \
            --git https://github.com/bg002h/mnemonic-key \
            --tag mk-cli-v0.3.1 \
            mk-cli

      - name: clone-upstream-mnemonic-toolkit
        run: |
          mkdir -p /tmp/upstream
          git clone --depth 1 \
            --branch mnemonic-toolkit-v0.13.0 \
            https://github.com/bg002h/mnemonic-toolkit \
            /tmp/upstream/mnemonic-toolkit

      - name: smoke-gui-schema-mnemonic
        run: mnemonic gui-schema | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['version']==1 and d['cli']=='mnemonic', d"

      - name: smoke-gui-schema-md
        run: md gui-schema | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['version']==1 and d['cli']=='md', d"

      - name: smoke-gui-schema-ms
        run: ms gui-schema | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['version']==1 and d['cli']=='ms', d"

      - name: smoke-gui-schema-mk
        run: mk gui-schema | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['version']==1 and d['cli']=='mk', d"

      - name: cargo-test-schema-mirror
        env:
          MNEMONIC_GUI_UPSTREAM_ROOT: /tmp/upstream/mnemonic-toolkit
          MNEMONIC_BIN: mnemonic
          MD_BIN: md
          MS_BIN: ms
          MK_BIN: mk
        run: cargo test --test schema_mirror

      - name: cargo-test-secrets-canonical-fallback
        # GHSA-class drift gate: the committed canonical-fallback SECRET_*
        # arrays in build.rs MUST match the upstream is_secret_bearing()
        # impls. An empty SECRET_* set silently disables
        # persistence::redact_for_persistence, causing BIP-39 phrases to
        # persist to state.json in plaintext. Regression of v0.3.0..0.3.2.
        env:
          MNEMONIC_GUI_UPSTREAM_ROOT: /tmp/upstream/mnemonic-toolkit
        run: cargo test --test secrets_canonical_fallback -- --include-ignored

      - name: cargo-test-full-suite
        env:
          MNEMONIC_GUI_UPSTREAM_ROOT: /tmp/upstream/mnemonic-toolkit
          MNEMONIC_BIN: mnemonic
          MD_BIN: md
          MS_BIN: ms
          MK_BIN: mk
        run: cargo test --workspace
