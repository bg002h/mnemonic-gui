name: build

on:
  push:
    branches: [master]
    tags: ['mnemonic-gui-v*']
  pull_request:
    branches: [master, "release/**"]

jobs:
  clippy:
    # v0.10.0 cycle (FOLLOWUP `clippy-test-target-cleanup`): dedicated
    # clippy gate covering the full target set (lib + bins + tests +
    # examples + benches). `--all-targets` catches lints in the test
    # tree that `--lib --bins` would silently skip.
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo-cache
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_suffix: x86_64-linux.tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_suffix: aarch64-linux.tar.gz
            cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact_suffix: x86_64-windows.zip
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact_suffix: x86_64-macos.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact_suffix: aarch64-macos.tar.gz
    steps:
      - uses: actions/checkout@v5

      - name: compute-version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#mnemonic-gui-}"
          # Sanitize slashes — PR refs are `<N>/merge`, which would
          # break tar/7z when interpolated into a filename (the `/`
          # is taken as a directory separator). Replace with `-` so
          # the artifact name stays a valid single-segment filename.
          # Tag refs have no slash and are unaffected.
          VERSION="${VERSION//\//-}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: install-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cargo-cache
        uses: Swatinem/rust-cache@v2

      - name: install-cross
        if: ${{ matrix.cross }}
        run: cargo install --locked cross

      - name: build-native
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: build-cross
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }}

      - name: package-unix
        if: ${{ !startsWith(matrix.runner, 'windows') }}
        env:
          ARTIFACT: mnemonic-gui-${{ env.VERSION }}-${{ matrix.artifact_suffix }}
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          tar -czf "../../../dist/$ARTIFACT" mnemonic-gui

      - name: package-windows
        if: ${{ startsWith(matrix.runner, 'windows') }}
        env:
          ARTIFACT: mnemonic-gui-${{ env.VERSION }}-${{ matrix.artifact_suffix }}
        run: |
          mkdir dist
          cd target/${{ matrix.target }}/release
          7z a "../../../dist/$env:ARTIFACT" mnemonic-gui.exe

      - name: upload-artifact
        if: startsWith(github.ref, 'refs/tags/mnemonic-gui-v')
        uses: actions/upload-artifact@v5
        with:
          name: mnemonic-gui-${{ env.VERSION }}-${{ matrix.artifact_suffix }}
          path: dist/mnemonic-gui-${{ env.VERSION }}-${{ matrix.artifact_suffix }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/mnemonic-gui-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download-artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: github-release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
