name: build

on:
  push:
    branches: [master]
    tags: ['mnemonic-gui-v*']
  pull_request:
    branches: [master, "release/**"]

jobs:
  clippy:
    # v0.10.0 cycle (FOLLOWUP `clippy-test-target-cleanup`): dedicated
    # clippy gate covering the full target set (lib + bins + tests +
    # examples + benches). `--all-targets` catches lints in the test
    # tree that `--lib --bins` would silently skip.
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo-cache
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

  headless:
    # P2 (P1-R0 Minor-1): the load-bearing `--no-default-features` gate. The
    # egui-free form model + the `gui-render` emit bin MUST build + lint clean
    # WITHOUT the eframe/egui/wgpu/winit graphics stack — that headless build
    # is what makes manual-gui's `verify-examples-gui` regeneration real. The
    # default `clippy` job (above) only exercises `gui`-on; nothing else here
    # stops a future PR from silently re-pulling egui into the headless
    # closure. Clippy is run WITHOUT `--all-targets` on purpose (Nit-1): the
    # egui_kittest test targets reference `egui::Ui` directly and only compile
    # with `gui` on; the headless gate covers lib + the non-gated `gui-render`
    # bin, which is exactly the surface the manual regenerates from.
    name: headless (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo-cache
        uses: Swatinem/rust-cache@v2

      - name: cargo build --no-default-features
        run: cargo build -p mnemonic-gui --no-default-features

      - name: cargo clippy --no-default-features -- -D warnings
        run: cargo clippy --no-default-features -- -D warnings

  msrv:
    # gui-msrv-ci-tested-invariant: compile-at-MSRV gate. Cargo.toml declares
    # `rust-version = "1.88"` (the binding floor is `image@0.25.10`, whose
    # rust_version is 1.88.0); the @stable clippy/build jobs never prove the
    # crate actually builds at that floor. This job pins the toolchain to
    # 1.88.0 and runs `cargo check --locked` so the declared MSRV is an
    # ENFORCED invariant, not an un-tested assertion. `--locked` is required:
    # it checks the committed lockfile's graph, so an unlocked re-resolve
    # cannot pull a newer-MSRV dep and mask drift.
    # NOTE: bumping the MSRV is a 2-site edit — Cargo.toml `rust-version`
    # AND the `@1.88.0` pin below must move together.
    name: msrv (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install-rust-1.88.0
        uses: dtolnay/rust-toolchain@1.88.0

      - name: cargo-cache
        uses: Swatinem/rust-cache@v2

      - name: cargo check --locked
        run: cargo check --locked

  snapshots:
    # Visual-screenshot track P1 (plan IMPLEMENTATION_PLAN_gui_visual_
    # screenshot_track.md; recipe RATIFIED by the P0-R0 review): the permanent
    # 61-form snapshot gate. Renders every GUI subcommand form headlessly on
    # the lavapipe CPU Vulkan driver (mesa-vulkan-drivers — fleet-proven: 6
    # distinct runner instances + a full GL backend swap all passed the
    # committed corpus at kittest's default 0.6 dify threshold) and compares
    # against tests/snapshots/forms/. NO path filter — the job fires on every
    # PR / master push / tag push (the tag-push run is the manual-gui leg's
    # provenance anchor).
    #
    # `--nocapture` is observability-only (adapter line + skip marker in the
    # log); the ran-at-all CENSUS below is the enforcement: kittest writes
    # `<name>.new.png` even on PASSING comparisons, so exactly 61 .new.png
    # files prove the suite rendered every form (never silently skipped or
    # subsetted). Corpus regeneration: any software rasterizer (locally:
    # GUI_SNAPSHOTS=1 WGPU_BACKEND=gl LIBGL_ALWAYS_SOFTWARE=1
    # UPDATE_SNAPSHOTS=1 cargo test --test gui_form_snapshots); this pinned
    # job arbitrates. Drift remediation follows the spec-§5 ladder: inspect
    # the uploaded .diff.png artifacts first — never blanket-raise the
    # threshold.
    name: snapshots
    runs-on: ubuntu-latest
    env:
      GUI_SNAPSHOTS: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5

      - name: install-lavapipe
        # mesa-vulkan-drivers on noble ships the lavapipe software Vulkan
        # driver (libvulkan_lvp.so + lvp_icd ICD json) — the CPU adapter
        # kittest's selector prefers. The Mesa version floats with the runner
        # image BY DESIGN (an image-bump drift is what the remediation ladder
        # exists for; the pinned-tarball recipe is the rung-4 escalation).
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: install-rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo-cache
        uses: Swatinem/rust-cache@v2

      - name: snapshot-suite
        run: GUI_SNAPSHOTS=1 cargo test --test gui_form_snapshots -- --nocapture

      - name: census-61
        run: |
          count="$(find tests/snapshots/forms -name '*.new.png' | wc -l)"
          echo "census: ${count} .new.png rendered (expect 61)"
          test "${count}" -eq 61

      - name: upload-diffs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: snapshot-diffs-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/snapshots/**/*.diff.png
          if-no-files-found: ignore

  tutorial-snapshots:
    # gui_example_tutorial cycle (plan P1.6): the permanent tutorial-corpus
    # gate. Drives the REAL whole-window app headlessly on the same ratified
    # lavapipe recipe as `snapshots` above (mesa-vulkan-drivers + lavapipe CPU
    # Vulkan + WGPU_BACKEND=vulkan) across the 25 shot-bearing / 50-shot
    # manifest (Ch 0 + J1-J5, `tests/tutorial/`), byte-comparing every filled-
    # form / modal / populated-pane shot AND every RunResult transcript. Unlike
    # the form gallery, each Run SPAWNS the pinned `mnemonic` CLI, so the
    # schema-mirror pinned-CLI install recipe is folded in below (tag sourced
    # from pinned-upstream.toml [mnemonic].tag; bare `mnemonic` on $PATH). NO
    # path filter — fires on every PR / master push / tag push (the tag-push
    # run is the manual-gui leg's provenance anchor).
    #
    # `--nocapture` is observability-only (adapter line + version-gate + budget
    # markers in the log); the DUAL manifest-derived census below is the
    # enforcement, and it NEVER hardcodes the shot total:
    #   * kittest writes `<stem>.new.png` for every shot even on a PASSING
    #     compare, so the `.new.png` count proves the suite rendered every shot.
    #     It is checked against the shot total grepped from the committed
    #     tests/tutorial/manifest-stems.txt — which the always-run
    #     `manifest_stems_regen_diff` test (part of the same `cargo test`
    #     invocation) byte-verifies against the manifest, so a passing test step
    #     guarantees that census source is authoritative.
    #   * the committed run-transcript count (`*.exit.txt`, exactly one per Run)
    #     is checked against the manifest's run count (same manifest-stems.txt
    #     source). Transcript BYTE-identity is asserted INSIDE the harness
    #     (persist_transcripts byte-compares vs committed, writing `<name>.new`
    #     and failing on any drift); this census is the completeness half.
    # Red-corpus remediation follows the snapshots ladder: inspect the uploaded
    # .diff.png artifacts first; a genuine environment re-pin is a temporary
    # `UPDATE_SNAPSHOTS=1 GUI_TUTORIAL_SNAPSHOTS=1 ... cargo test` regen + commit
    # — never blanket-raise a threshold, never merge red.
    name: tutorial-snapshots
    runs-on: ubuntu-latest
    env:
      GUI_TUTORIAL_SNAPSHOTS: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5

      - name: install-lavapipe
        # Same software-Vulkan driver the `snapshots` job pins — the CPU adapter
        # the harness's adapter_guard requires (device_type == Cpu + honors
        # WGPU_BACKEND=vulkan).
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: install-rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo-cache
        uses: Swatinem/rust-cache@v2

      - name: parse-pinned-upstream
        # Single source of truth for the pinned toolkit tag: pinned-upstream.toml
        # [mnemonic].tag, parsed via python3 stdlib tomllib (the schema-mirror.yml
        # pattern). The tutorial manifest spawns ONLY `mnemonic` — every journey
        # is `mnemonic <subcommand>` (harness `spawned_clis()` == ["mnemonic"]);
        # md/ms/mk are LIBRARY deps of the toolkit, never subprocesses — so only
        # the toolkit CLI is installed (the pinned-tier-version-gate probes and
        # every Run spawns just `mnemonic`).
        id: pins
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pinned-upstream.toml", "rb") as f:
              d = tomllib.load(f)
          print(f"mnemonic_tag={d['mnemonic']['tag']}")
          PY

      - name: install-mnemonic-toolkit
        # The pinned `mnemonic` binary on $PATH (bare name). The harness's
        # pinned-tier-version-gate probes `mnemonic --version` against the
        # schema's pinned_version BEFORE any render or spawn, then every Run
        # spawns it — a wrong tier HARD-fails the suite by name.
        env:
          TAG: ${{ steps.pins.outputs.mnemonic_tag }}
        run: |
          cargo install --locked \
            --git https://github.com/bg002h/mnemonic-toolkit \
            --tag "$TAG" \
            mnemonic-toolkit

      - name: tutorial-snapshot-suite
        run: GUI_TUTORIAL_SNAPSHOTS=1 cargo test --test gui_tutorial_snapshots -- --nocapture

      - name: census
        # Fail-closed + manifest-derived (NEVER a hardcoded 50/51). The prior
        # step passing guarantees manifest-stems.txt matches the manifest (the
        # always-run `manifest_stems_regen_diff` test), so the grepped counts
        # below are the authoritative manifest totals — a wrong count fails.
        run: |
          expected_shots="$(grep -c '\.png$' tests/tutorial/manifest-stems.txt)"
          new_count="$(find tests/snapshots/tutorial -name '*.new.png' | wc -l)"
          echo "census(shots): ${new_count} .new.png rendered (expect ${expected_shots} per manifest-stems.txt)"
          test "${new_count}" -eq "${expected_shots}"
          expected_runs="$(grep -c '\.exit\.txt$' tests/tutorial/manifest-stems.txt)"
          run_count="$(find tests/snapshots/tutorial -name '*.exit.txt' | wc -l)"
          echo "census(runs): ${run_count} committed run transcript(s) (expect ${expected_runs} per manifest-stems.txt)"
          test "${run_count}" -eq "${expected_runs}"

      - name: upload-diffs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: tutorial-snapshot-diffs-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/snapshots/tutorial/**/*.diff.png
          if-no-files-found: ignore

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_suffix: x86_64-linux.tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_suffix: aarch64-linux.tar.gz
            cross: true
          # Fully-static musl binaries for air-gapped / Alpine / musl boxes.
          # `-musl` suffixes avoid colliding with the gnu `*-linux.tar.gz`
          # asset names. crt-static is ON by default for musl; NEVER pass
          # `-Ctarget-feature=-crt-static` (rust#135244 silently links host
          # glibc). x86_64-musl builds natively (needs `musl-tools` +
          # `CC_x86_64_unknown_linux_musl=musl-gcc` for the secp256k1-sys C);
          # aarch64-musl reuses the existing `cross: true` machinery.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            artifact_suffix: x86_64-linux-musl.tar.gz
            musl_native: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            artifact_suffix: aarch64-linux-musl.tar.gz
            cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact_suffix: x86_64-windows.zip
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact_suffix: x86_64-macos.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact_suffix: aarch64-macos.tar.gz
    steps:
      - uses: actions/checkout@v5

      - name: compute-version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#mnemonic-gui-}"
          # Sanitize slashes — PR refs are `<N>/merge`, which would
          # break tar/7z when interpolated into a filename (the `/`
          # is taken as a directory separator). Replace with `-` so
          # the artifact name stays a valid single-segment filename.
          # Tag refs have no slash and are unaffected.
          VERSION="${VERSION//\//-}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: install-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cargo-cache
        uses: Swatinem/rust-cache@v2

      - name: install-musl-tools
        # x86_64-musl builds natively; cc-rs needs `musl-gcc` to compile the
        # secp256k1-sys vendored libsecp256k1 against musl (else it silently
        # falls back to host gcc → glibc-linked). aarch64-musl uses `cross`
        # (which bundles the musl cross C toolchain), so no apt step there.
        if: ${{ matrix.musl_native }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: install-cross
        if: ${{ matrix.cross }}
        run: cargo install --locked cross

      - name: build-native
        if: ${{ !matrix.cross }}
        # `CC_x86_64_unknown_linux_musl` only affects the x86_64-musl target;
        # it is harmless on the other native rows (gnu / darwin / windows).
        # crt-static is ON by default for musl — no RUSTFLAGS needed; NEVER
        # set `-Ctarget-feature=-crt-static` (rust#135244 links host glibc).
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: build-cross
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }}

      - name: package-unix
        if: ${{ !startsWith(matrix.runner, 'windows') }}
        env:
          ARTIFACT: mnemonic-gui-${{ env.VERSION }}-${{ matrix.artifact_suffix }}
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          tar -czf "../../../dist/$ARTIFACT" mnemonic-gui

      - name: package-windows
        if: ${{ startsWith(matrix.runner, 'windows') }}
        env:
          ARTIFACT: mnemonic-gui-${{ env.VERSION }}-${{ matrix.artifact_suffix }}
        run: |
          mkdir dist
          cd target/${{ matrix.target }}/release
          7z a "../../../dist/$env:ARTIFACT" mnemonic-gui.exe

      - name: upload-artifact
        if: startsWith(github.ref, 'refs/tags/mnemonic-gui-v')
        uses: actions/upload-artifact@v5
        with:
          name: mnemonic-gui-${{ env.VERSION }}-${{ matrix.artifact_suffix }}
          path: dist/mnemonic-gui-${{ env.VERSION }}-${{ matrix.artifact_suffix }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/mnemonic-gui-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download-artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: sha256sums
        # Emit ONE combined SHA256SUMS over every release tarball (musl + gnu +
        # darwin + windows), so an air-gapped user can verify a downloaded blob
        # out-of-band — the integrity material the static custody binaries need.
        # `actions/download-artifact@v5` nests each artifact under
        # `artifacts/<artifact-name>/`, and the GUI artifact name ENDS in
        # `.tar.gz` / `.zip`, so a naive `find . -name "*.tar.gz" | xargs
        # sha256sum` would hit the WRAPPER DIRECTORIES (`Is a directory` hard
        # fail under set -e) and emit nested `dir/file` paths. The find filter
        # matches BOTH `*.tar.gz` (musl + gnu + darwin) AND `*.zip` (windows) so
        # EVERY published release asset is checksummed. `-type f` plus a
        # per-file `cd` into the asset's directory makes each line carry the
        # published BASENAME, so `sha256sum -c SHA256SUMS` passes against the
        # flat downloaded asset. Written under `artifacts/` so the existing
        # `files: artifacts/**/*` glob uploads it. *static + checksummed* — not
        # bit-for-bit reproducible.
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) | while read -r f; do
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" )
          done | sort -k2 > SHA256SUMS
      - name: github-release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
