[package]
name = "mnemonic-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bg002h/mnemonic-gui"
description = "Cross-platform GUI overlay for the m-format constellation CLIs (mnemonic, md, ms, mk)"
readme = "README.md"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
shlex = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
syn = { version = "2", features = ["full"] }
toml = "0.8"
