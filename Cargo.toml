[package]
name = "mnemonic-gui"
version = "0.53.0"
edition = "2021"
# The locked dependency graph (icu_*@2.2.0, idna_adapter@1.2.2, image@0.25.x,
# pulled since v0.40.0) requires rustc >= 1.88. The prior "1.85" was wrong —
# the crate never actually built on 1.85. (The four sibling CLIs build on 1.85.)
rust-version = "1.88"
license = "MIT OR Unlicense"
repository = "https://github.com/bg002h/mnemonic-gui"
description = "Cross-platform GUI overlay for the m-format constellation CLIs (mnemonic, md, ms, mk)"
readme = "README.md"

[features]
# P1 `gui`-feature split (SPEC §3). Default-on so the GUI app + the full test
# suite build unchanged. `--no-default-features` drops the egui graphics stack
# (eframe/egui → wgpu/winit) AND the 5 gated form-widget modules + the
# `mnemonic-gui` bin, leaving the egui-free form model + the headless
# `gui-render` emit-mode (P2). Independent regeneration of the manual's form
# renders is what makes the manual-gui `verify-examples-gui` gate real.
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]

# The GUI app binary requires the `gui` feature. Without this `required-features`
# pin, gating `src/main.rs`'s egui deps would make `cargo build
# --no-default-features` fail "main not found"; instead the bin is skipped
# entirely when `gui` is off (P1 m1). Name/path mirror the prior auto-discovered
# default bin so the binary name is unchanged.
[[bin]]
name = "mnemonic-gui"
path = "src/main.rs"
required-features = ["gui"]

# P2 — the headless structural-form emit binary. NOT gated: builds + runs
# under `--no-default-features` (the egui-free form model only). Hyphenated
# name (`gui-render`); explicit `[[bin]]` so the name is stable regardless of
# auto-discovery.
[[bin]]
name = "gui-render"
path = "src/bin/gui_render.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# P1: eframe + egui are OPTIONAL + enabled by the default-on `gui` feature —
# NEVER list them under a non-`gui` path (that would re-pull the graphics stack
# into the headless build). wgpu/winit arrive transitively through eframe.
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "accesskit"], optional = true }
egui = { version = "0.31", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
shlex = "1"
# v0.2 Phase C.1: pinned-upstream.toml reader in schema_check.rs.
# Was [dev-dependencies] only in v0.1; promoted to runtime dep in
# v0.2 since the GUI now reads the pinned table at runtime to decide
# the regex vs gui-schema-JSON path per CLI.
toml = "0.8"
# v0.8.0 Phase 6 SPEC §6.10.7 row 15 — `classify_descriptor_canonicity`
# in `form/conditional.rs` uses 5 static-compiled regex matchers for the
# canonical wrapper shapes from md-codec's canonical_origin table. Direct
# dep at the call site keeps the classifier independent of transitive
# import paths.
regex = "1"
# v0.4.0: replaces the v0.3.x build.rs source-walker. Provides the
# canonical SECRET_NODE_TYPES + SECRET_SLOT_SUBKEYS public constants
# used by `persistence::redact_for_persistence` to strip secret-class
# slot rows and node-value composites before serializing session state.
# Retiring the source-walker eliminates the v0.3.0..v0.3.2 stub-fallback
# class of bug (empty SECRET_* arrays under `cargo install --git`
# sandboxes → BIP-39 phrases leaked to state.json). See toolkit
# `secret-taxonomy-public-api-promotion` FOLLOWUP for the full
# architectural rationale.
mnemonic-toolkit = { git = "https://github.com/bg002h/mnemonic-toolkit", tag = "mnemonic-toolkit-v0.74.0" }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
ctrlc = "3"
# v0.2 Phase B.2: SetWindowDisplayAffinity + WDA_EXCLUDEFROMCAPTURE
# for OS-snapshot occlusion (Task View thumbnails).
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# v0.2 Phase B.2: NSWindowSharingType::None for OS-snapshot occlusion
# (App Switcher / Mission Control thumbnails).
objc2 = "0.5"
objc2-app-kit = "0.2"

[dependencies.raw-window-handle]
# eframe re-exports this transitively; importing explicitly to keep
# the Phase B.2 platform module's signature stable.
version = "0.6"

[dev-dependencies]
tempfile = "3"
# v0.4.0: syn / quote / proc-macro2 retained because tests/schema_mirror.rs
# still re-parses upstream clap-derive flag surfaces. The persistence-class
# secret-walker that used these in build.rs is retired in favor of the
# toolkit's pub mod secret_taxonomy.
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
toml = "0.8"
# Visual-screenshot track (P0 spike → P1 suite): `wgpu` + `snapshot` enable the
# kittest offscreen render + dify threshold-diff path. DEV-graph only — the
# shipped binary graph is untouched; the existing AccessKit-only harness tests
# are unaffected (LazyRenderer defers all wgpu work until the first `render()`).
egui_kittest = { version = "0.31", features = ["wgpu", "snapshot"] }
# P5 one-time UI-harness coverage sweep (tests/ui_harness_sweep.rs): bounded
# proptest leaf-value + toggle-sequence variation atop the per-subcommand seed
# table. Dev-only — never enters the shipped GUI binary's dependency graph.
proptest = "1"
