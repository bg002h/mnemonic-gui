[package]
name = "mnemonic-gui"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bg002h/mnemonic-gui"
description = "Cross-platform GUI overlay for the m-format constellation CLIs (mnemonic, md, ms, mk)"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
shlex = "1"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
toml = "0.8"

[build-dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
toml = "0.8"
