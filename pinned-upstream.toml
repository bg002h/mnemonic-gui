# pinned-upstream.toml — schema-mirror pin map (SPEC §11)
#
# Consumed by:
#   1. .github/workflows/schema-mirror.yml CI gate (Phase 9).
#   2. src/schema_check.rs runtime soft-check (Phase 9).
#
# v0.4.0 update: the [mnemonic].tag field is now documentary only.
# Prior to v0.4.0 the GUI's build.rs scraped the toolkit's private
# source for SECRET_NODE_TYPES / SECRET_SLOT_SUBKEYS at the pinned
# tag, with a stub fallback that emitted empty arrays under cargo
# install --git sandboxes (HIGH-severity persistence-leak bug; see
# CHANGELOG v0.3.3 + v0.4.0). build.rs is now deleted. The toolkit
# dependency tag pin lives in Cargo.toml's [dependencies] table
# (the load-bearing pin); the tag here is kept for cross-cite
# parity with sibling-repo FOLLOWUPS and the schema-mirror flag-name
# parity gate that still re-parses upstream clap-derive surfaces.

[mnemonic]
url = "https://github.com/bg002h/mnemonic-toolkit"
# Cross-cite with Cargo.toml's [dependencies] mnemonic-toolkit tag.
# Both should bump in lockstep when the toolkit is upgraded.
tag = "mnemonic-toolkit-v0.105.1"
bin = "mnemonic"
workspace-member-path = "crates/mnemonic-toolkit"
# v0.2 Phase C.1: GUI consults `<cli> gui-schema` JSON path when true;
# falls back to v0.1 regex-on-`--help` when false. Flipped to true
# per-CLI in Phase C.3 once the sibling-repo PR (Phase C.2) lands
# and pinned `tag` bumps to the release that includes `gui-schema`.
gui-schema-capable = true

[md]
# F-679 (2026-09-24): v0.11.0 -> v0.20.3, the released md the toolkit
# installer ships. Mirror updated in lockstep (src/schema/md.rs); new
# upstream-only subcommands (compose, shape-key, descriptor, decompose) are
# deliberately NOT surfaced yet (CHANGELOG 0.62.0).
# man-pages cycle: bumped to descriptor-mnemonic-md-cli-v0.11.0 to match
# the released binary (md --version → "md 0.11.0"). Schema and
# pinned-upstream tag must move in lockstep so the runtime soft-check
# can't fire a false-positive banner. v0.11.0 adds the visible `md
# gen-man --out` subcommand (mirrored in src/schema/md.rs this cycle).
url = "https://github.com/bg002h/descriptor-mnemonic"
tag = "descriptor-mnemonic-md-cli-v0.20.3"
bin = "md"
workspace-member-path = "crates/md-cli"
gui-schema-capable = true

[ms]
url = "https://github.com/bg002h/mnemonic-secret"
# F-694 (2026-09-25): v0.19.1 -> v0.20.1 with toolkit v0.104.0 -> v0.105.1
# (F-687 `-`/`@env:VAR` on every password flag, one trailing-newline rule,
# empty-value warning, terminal prompt; F-683 `--separator` offers only
# `space`; F-689, F-691, F-693). A re-measure plus data update (DESIGN §A0).
# F-679 (2026-09-24): v0.16.0 -> v0.19.0 (argv-secret refusal, --in/--out,
# three new derive templates; `hashlock` not surfaced yet), then -> v0.19.1
# (fold 2): an --allow-argv-secret-admitted value is no longer taken for a
# stdin read in verify/derive/combine (F-679 review I1). gui-schema output is
# byte-identical to 0.19.0; only --help EXAMPLES text changed.
# Bumped v0.13.0 -> v0.16.0 (2026-08-19): the hand mirror lists `ms derive
# --template`'s bip48 arms (bip48-p2wsh, bip48-p2sh-p2wsh, bip48) and the pinned
# v0.13.0 has NONE of them, so the schema-mirror gate was red on a mirror that
# described a RELEASED ms the pin had not caught up to. v0.16.0 is tagged
# upstream; the mirror is right and this pin was stale.
tag = "ms-cli-v0.20.1"
bin = "ms"
workspace-member-path = "crates/ms-cli"
gui-schema-capable = true

[mk]
url = "https://github.com/bg002h/mnemonic-key"
tag = "mk-cli-v0.13.0"
bin = "mk"
workspace-member-path = "crates/mk-cli"
gui-schema-capable = true
