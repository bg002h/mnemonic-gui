# genuine: harness flags after -- are fine, and a && chain after a real run is fine
on: [push, pull_request]
jobs:
  mac:
    runs-on: macos-latest
    env: {MNEMONIC_BIN: mnemonic}
    steps:
      - run: cargo test --locked --test secret_channels_t2 --test secret_channels_t3prime --test secret_channels_t7 -- --nocapture && echo done
