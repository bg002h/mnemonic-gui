# genuine: the Linux job the implementing change adds to schema-mirror.yml
on: [push, pull_request]
jobs:
  secret-channels:
    runs-on: ubuntu-latest
    env:
      MNEMONIC_BIN: mnemonic
      MS_BIN: ms
